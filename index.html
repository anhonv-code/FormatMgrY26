<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>🍬 สุ่มขนม</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #f7c948;
      --gold2: #ff8c00;
      --bg1: #0f0c29;
      --bg2: #302b63;
      --bg3: #24243e;
      --win: #5ef080;
      --lose: #ff7675;
      --card: rgba(255,255,255,.07);
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      color: #fff;
    }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 10px; }
    header h1 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      letter-spacing: 2px;
      text-shadow: 0 0 24px var(--gold);
    }
    header p { color: rgba(255,255,255,.7); font-size: .9rem; margin-top: 4px; }

    /* ── SETTINGS BAR ── */
    .settings-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .settings-bar label { font-size: .85rem; color: rgba(255,255,255,.7); }
    .settings-bar input[type=number] {
      width: 64px;
      padding: 5px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: .9rem;
      text-align: center;
    }
    .badge {
      background: rgba(247,201,72,.15);
      border: 1px solid rgba(247,201,72,.4);
      color: var(--gold);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: .85rem;
      font-weight: 600;
    }

    /* ── WHEEL ── */
    .wheel-wrap {
      position: relative;
      width: min(340px, 90vw);
      height: min(340px, 90vw);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 36px solid var(--gold);
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.6));
      z-index: 10;
    }
    #wheelCanvas {
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(247,201,72,.2), 0 10px 40px rgba(0,0,0,.5);
      transition: transform 4s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      width: 100%; height: 100%;
    }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
    .spin-btn {
      padding: 14px 40px;
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(247,201,72,.4);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: .5px;
    }
    .spin-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(247,201,72,.55); }
    .spin-btn:active:not(:disabled) { transform: translateY(0); }
    .spin-btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }

    .reset-btn {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      border-radius: 50px;
      cursor: pointer;
      transition: background .2s;
    }
    .reset-btn:hover { background: rgba(255,255,255,.2); }

    /* ── STOCK DOTS ── */
    .stock-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: rgba(255,255,255,.8);
      flex-wrap: wrap;
      justify-content: center;
    }
    .stock-dots { display: flex; gap: 4px; flex-wrap: wrap; max-width: min(280px, 85vw); justify-content: center; }
    .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--gold);
      transition: background .3s, transform .3s;
    }
    .dot.used { background: rgba(255,255,255,.15); transform: scale(.7); }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
      margin-top: 18px;
    }
    .stat-card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 12px 14px;
      text-align: center;
    }
    .stat-card .val { font-size: 1.5rem; font-weight: 700; }
    .stat-card .lbl { font-size: .72rem; color: rgba(255,255,255,.55); margin-top: 2px; }
    #profitVal { color: var(--win); }

    /* ── HISTORY ── */
    .history-wrap {
      width: 100%;
      max-width: 400px;
      margin-top: 16px;
    }
    .history-title { font-size: .8rem; color: rgba(255,255,255,.5); margin-bottom: 8px; text-align: center; }
    .history-list {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .h-chip {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .82rem;
      font-weight: 600;
      animation: popIn .25s ease;
    }
    .h-chip.win  { background: rgba(94,240,128,.15); border: 1px solid rgba(94,240,128,.4); color: var(--win); }
    .h-chip.lose { background: rgba(255,118,117,.1);  border: 1px solid rgba(255,118,117,.3); color: var(--lose); }
    @keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ── SOUND TOGGLE ── */
    .sound-toggle {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      color: rgba(255,255,255,.5);
      cursor: pointer;
      user-select: none;
    }
    .sound-toggle input { cursor: pointer; }

    /* ── OVERLAY & POPUP ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 50; display: none; cursor: pointer;
    }
    .overlay.show { display: block; }
    .popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(.7);
      opacity: 0;
      background: #1e1b3a;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      padding: 32px 44px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,.7);
      z-index: 60;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s;
      min-width: 260px;
      max-width: 90vw;
    }
    .popup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    .popup .p-icon { font-size: 4rem; margin-bottom: 8px; }
    .popup .p-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .popup .p-sub { font-size: .85rem; color: rgba(255,255,255,.65); margin-bottom: 20px; }
    .popup.win  .p-title { color: var(--win); }
    .popup.lose .p-title { color: var(--lose); }
    .close-btn {
      padding: 10px 28px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #1a1a2e; font-weight: 700;
      border: none; border-radius: 25px;
      cursor: pointer; font-size: .95rem;
      transition: transform .15s;
    }
    .close-btn:hover { transform: scale(1.05); }

    /* ── CONFETTI ── */
    .confetti-piece {
      position: fixed; top: -20px;
      font-size: 1.6rem;
      animation: fall linear forwards;
      pointer-events: none; z-index: 70;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

<header>
  <h1>🍬 สุ่มขนม</h1>
  <p>หมุนวงล้อเพื่อลุ้นรับขนม!</p>
</header>

<div class="settings-bar">
  <span class="badge">💰 ราคาหมุน <strong>10฿</strong>/ครั้ง</span>
  <label>ขนมทั้งหมด
    <input type="number" id="stockInput" value="20" min="1" max="99" />
  </label>
</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheelCanvas"></canvas>
</div>

<div class="btn-row">
  <button class="spin-btn" id="spinBtn">🎰 หมุนเลย! (10฿)</button>
  <button class="reset-btn" id="resetBtn">🔄 รีเซ็ต</button>
</div>

<div class="stock-row">
  <span>เหลือ:</span>
  <div class="stock-dots" id="stockDots"></div>
  <span><b id="stockNum">20</b> ชิ้น</span>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="val" id="spinsVal">0</div>
    <div class="lbl">ครั้งที่หมุน</div>
  </div>
  <div class="stat-card">
    <div class="val" id="revenueVal">0฿</div>
    <div class="lbl">รายรับรวม</div>
  </div>
  <div class="stat-card">
    <div class="val" id="costVal">0฿</div>
    <div class="lbl">ต้นทุนขนม</div>
  </div>
  <div class="stat-card">
    <div class="val" id="profitVal">0฿</div>
    <div class="lbl">กำไรสุทธิ</div>
  </div>
</div>

<div class="history-wrap">
  <div class="history-title">ผลล่าสุด 8 ครั้ง</div>
  <div class="history-list" id="historyList"></div>
</div>

<label class="sound-toggle">
  <input type="checkbox" id="soundToggle" checked />
  เสียงเอฟเฟกต์
</label>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
  <div class="p-icon" id="pIcon"></div>
  <div class="p-title" id="pTitle"></div>
  <div class="p-sub" id="pSub"></div>
  <button class="close-btn" id="closeBtn">ตกลง</button>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────────── */
const SPIN_COST  = 10;
const CANDY_COST = 6;
// 12 sections: 8 win + 4 lose → win-rate 66.7% → avg profit 6฿/spin
const SECTIONS = [
  { emoji:'🍬', label:'ได้ขนม!', type:'win',  bg:'#ff6b6b', fg:'#2d0000' },
  { emoji:'🍭', label:'ได้ขนม!', type:'win',  bg:'#4ecdc4', fg:'#002d2b' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#3a3a5c', fg:'#aaa'    },
  { emoji:'🍫', label:'ได้ขนม!', type:'win',  bg:'#f7dc6f', fg:'#2d2500' },
  { emoji:'🍡', label:'ได้ขนม!', type:'win',  bg:'#c39bd3', fg:'#200030' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#3a3a5c', fg:'#aaa'    },
  { emoji:'🧁', label:'ได้ขนม!', type:'win',  bg:'#f0b27a', fg:'#2d1400' },
  { emoji:'🍩', label:'ได้ขนม!', type:'win',  bg:'#82e0aa', fg:'#002d12' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#3a3a5c', fg:'#aaa'    },
  { emoji:'🍪', label:'ได้ขนม!', type:'win',  bg:'#85c1e9', fg:'#001a2d' },
  { emoji:'🍮', label:'ได้ขนม!', type:'win',  bg:'#f1948a', fg:'#2d0000' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#3a3a5c', fg:'#aaa'    },
];
const N = SECTIONS.length;
const SEC_DEG = 360 / N;

/* ── STATE ──────────────────────────────────────────────────────────── */
let spinning   = false;
let currentDeg = 0;
let stock, totalSpins, revenue, costTotal, history;

function getInitStock() {
  return Math.max(1, Math.min(99, parseInt(document.getElementById('stockInput').value) || 20));
}

function initState() {
  stock = getInitStock();
  totalSpins = 0;
  revenue    = 0;
  costTotal  = 0;
  history    = [];
  currentDeg = 0;
  canvas.style.transition = 'none';
  canvas.style.transform  = 'rotate(0deg)';
  updateUI();
  buildDots();
  renderHistory();
  const btn = document.getElementById('spinBtn');
  btn.disabled = false;
  btn.textContent = '🎰 หมุนเลย! (10฿)';
}

/* ── CANVAS ─────────────────────────────────────────────────────────── */
const canvas = document.getElementById('wheelCanvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const size = Math.min(340, window.innerWidth * 0.88);
  canvas.width = canvas.height = Math.round(size);
  drawWheel();
}

function drawWheel() {
  const W = canvas.width, CX = W/2, CY = W/2, R = CX - 6;
  ctx.clearRect(0, 0, W, W);
  for (let i = 0; i < N; i++) {
    const s = (i * SEC_DEG - 90) * Math.PI/180;
    const e = ((i+1) * SEC_DEG - 90) * Math.PI/180;
    const m = ((i+.5) * SEC_DEG - 90) * Math.PI/180;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,s,e); ctx.closePath();
    ctx.fillStyle = SECTIONS[i].bg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1.5; ctx.stroke();
    const tx = CX + R*.64*Math.cos(m), ty = CY + R*.64*Math.sin(m);
    ctx.save(); ctx.translate(tx,ty); ctx.rotate(m + Math.PI/2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fs = Math.max(14, Math.round(W * .063));
    ctx.font = `${fs}px Arial`; ctx.fillText(SECTIONS[i].emoji, 0, -fs*.45);
    ctx.font = `bold ${Math.max(8, Math.round(W*.028))}px Segoe UI,sans-serif`;
    ctx.fillStyle = SECTIONS[i].fg; ctx.fillText(SECTIONS[i].label, 0, fs*.6);
    ctx.restore();
  }
  // gold ring
  ctx.beginPath(); ctx.arc(CX,CY,R,0,2*Math.PI);
  ctx.strokeStyle = '#f7c948'; ctx.lineWidth = 4; ctx.stroke();
  // hub
  const g = ctx.createRadialGradient(CX,CY,0,CX,CY,CX*.08);
  g.addColorStop(0,'#ffe566'); g.addColorStop(1,'#e67e00');
  ctx.beginPath(); ctx.arc(CX,CY,CX*.08,0,2*Math.PI);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.font = `${Math.round(CX*.11)}px Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⭐',CX,CY);
}

/* ── DOTS ───────────────────────────────────────────────────────────── */
function buildDots() {
  const el = document.getElementById('stockDots');
  el.innerHTML = '';
  for (let i = 0; i < stock; i++) {
    const d = document.createElement('div');
    d.className = 'dot'; d.id = `dot-${i}`; el.appendChild(d);
  }
  document.getElementById('stockNum').textContent = stock;
}
function useDot(idx) {
  const d = document.getElementById(`dot-${idx}`);
  if (d) d.classList.add('used');
}

/* ── HISTORY ────────────────────────────────────────────────────────── */
function renderHistory() {
  const el = document.getElementById('historyList');
  el.innerHTML = '';
  history.slice(-8).forEach(h => {
    const c = document.createElement('div');
    c.className = `h-chip ${h.type}`;
    c.textContent = h.type === 'win' ? `${h.emoji} ได้ขนม` : '💨 ไม่ได้';
    el.prepend(c);
  });
}

/* ── SOUND ──────────────────────────────────────────────────────────── */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playWin() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ac = getAudio();
    [523,659,784,1047].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ac.currentTime + i*.12;
      g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t+.3);
      o.start(t); o.stop(t+.3);
    });
  } catch(e) {}
}
function playLose() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ac = getAudio();
    [300,250].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ac.currentTime + i*.18;
      g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t+.35);
      o.start(t); o.stop(t+.35);
    });
  } catch(e) {}
}

/* ── SPIN ───────────────────────────────────────────────────────────── */
document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('resetBtn').addEventListener('click', () => { closePopup(); initState(); });
document.getElementById('stockInput').addEventListener('change', initState);

function spin() {
  if (spinning || stock <= 0) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const idx = Math.floor(Math.random() * N);
  const needed = (360 - (idx + .5) * SEC_DEG % 360 + 360) % 360;
  const norm   = ((currentDeg % 360) + 360) % 360;
  const delta  = ((needed - norm) + 360) % 360 || 360;
  const newDeg = currentDeg + 1440 + delta;

  canvas.style.transition = 'none';
  canvas.style.transform  = `rotate(${currentDeg}deg)`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    canvas.style.transition = 'transform 4s cubic-bezier(0.22, 1, 0.36, 1)';
    canvas.style.transform  = `rotate(${newDeg}deg)`;
  }));

  canvas.addEventListener('transitionend', function h() {
    canvas.removeEventListener('transitionend', h);
    currentDeg = newDeg;
    spinning   = false;

    totalSpins++; revenue += SPIN_COST;
    const sec = SECTIONS[idx];
    if (sec.type === 'win') {
      costTotal += CANDY_COST;
      useDot(stock - 1);
      stock--;
      document.getElementById('stockNum').textContent = stock;
    }
    history.push({ type: sec.type, emoji: sec.emoji });
    updateUI(); renderHistory();
    sec.type === 'win' ? playWin() : playLose();
    showPopup(sec);
    if (stock <= 0) {
      document.getElementById('spinBtn').textContent = '❌ ขนมหมดแล้ว';
      document.getElementById('spinBtn').disabled = true;
    } else {
      document.getElementById('spinBtn').disabled = false;
    }
  });
}

/* ── UI ─────────────────────────────────────────────────────────────── */
function updateUI() {
  const profit = revenue - costTotal;
  document.getElementById('spinsVal').textContent   = totalSpins;
  document.getElementById('revenueVal').textContent = revenue + '฿';
  document.getElementById('costVal').textContent    = costTotal + '฿';
  document.getElementById('profitVal').textContent  = profit + '฿';
  document.getElementById('profitVal').style.color  = profit >= 0 ? 'var(--win)' : 'var(--lose)';
}

/* ── POPUP ──────────────────────────────────────────────────────────── */
const overlay = document.getElementById('overlay');
const popup   = document.getElementById('popup');
document.getElementById('closeBtn').addEventListener('click', closePopup);
overlay.addEventListener('click', closePopup);

function showPopup(sec) {
  popup.className = 'popup ' + sec.type;
  document.getElementById('pIcon').textContent  = sec.emoji;
  if (sec.type === 'win') {
    document.getElementById('pTitle').textContent = '🎉 ยินดีด้วย! ได้ขนม!';
    document.getElementById('pSub').textContent   = `คุณได้รับขนม 1 ชิ้น | เหลือขนม ${stock} ชิ้น`;
    launchConfetti();
  } else {
    document.getElementById('pTitle').textContent = '😢 เสียใจด้วย';
    document.getElementById('pSub').textContent   = 'โชคดีครั้งหน้านะ! ลองอีกสักครั้ง';
  }
  overlay.classList.add('show');
  requestAnimationFrame(() => popup.classList.add('show'));
}
function closePopup() {
  popup.classList.remove('show');
  overlay.classList.remove('show');
}

/* ── CONFETTI ───────────────────────────────────────────────────────── */
const CE = ['🍬','🍭','🍡','🍩','🍪','🍫','🧁','🌟','✨','🎊'];
function launchConfetti() {
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = CE[Math.floor(Math.random()*CE.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.fontSize = (1.1+Math.random()*1.4)+'rem';
    const dur = 1.6+Math.random()*1.4;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = (Math.random()*.4)+'s';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur+.5)*1000);
  }
}

/* ── INIT ───────────────────────────────────────────────────────────── */
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
initState();
</script>
</body>
</html>

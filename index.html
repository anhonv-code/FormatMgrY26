<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍬 สุ่มขนม — Candy Spin Wheel</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      color: #fff;
    }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 2.4rem; letter-spacing: 2px; text-shadow: 0 0 20px #f7c948; }
    header p  { margin-top: 6px; color: rgba(255,255,255,.75); font-size: .95rem; }

    /* ── PRICE BADGE ── */
    .badge {
      background: rgba(247,201,72,.15);
      border: 1px solid rgba(247,201,72,.4);
      color: #f7c948;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 22px;
    }

    /* ── WHEEL WRAPPER ── */
    .wheel-wrap {
      position: relative;
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* pointer triangle — fixed, above wheel */
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left:  16px solid transparent;
      border-right: 16px solid transparent;
      border-top:   40px solid #f7c948;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.6));
      z-index: 10;
    }

    #wheelCanvas {
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(247,201,72,.25), 0 10px 40px rgba(0,0,0,.5);
      /* transition handled by JS; set here as default */
      transition: transform 4s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* ── SPIN BUTTON ── */
    .spin-btn {
      margin-top: 26px;
      padding: 14px 48px;
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f7c948, #ff8c00);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(247,201,72,.4);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: .5px;
    }
    .spin-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(247,201,72,.55);
    }
    .spin-btn:active:not(:disabled) { transform: translateY(0); }
    .spin-btn:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── STOCK INDICATOR ── */
    .stock-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .95rem;
      color: rgba(255,255,255,.8);
    }
    .stock-dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      max-width: 240px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f7c948;
      transition: background .3s, transform .3s;
    }
    .dot.used {
      background: rgba(255,255,255,.18);
      transform: scale(.75);
    }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 400px;
      margin-top: 24px;
    }
    .stat-card {
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: center;
    }
    .stat-card .val {
      font-size: 1.65rem;
      font-weight: 700;
    }
    .stat-card .lbl {
      font-size: .75rem;
      color: rgba(255,255,255,.6);
      margin-top: 2px;
    }
    #profitVal { color: #5ef080; }

    /* ── PROFIT NOTE ── */
    .note {
      margin-top: 10px;
      font-size: .72rem;
      color: rgba(255,255,255,.4);
      text-align: center;
    }

    /* ── OVERLAY & POPUP ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      cursor: pointer;
    }
    .overlay.show { display: block; }

    .popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(.7);
      opacity: 0;
      background: #1e1b3a;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      padding: 36px 48px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,.7);
      z-index: 60;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s;
      min-width: 280px;
    }
    .popup.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    .popup .p-icon { font-size: 4.5rem; margin-bottom: 8px; }
    .popup .p-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .popup .p-sub {
      font-size: .9rem;
      color: rgba(255,255,255,.65);
      margin-bottom: 20px;
    }
    .popup.win  .p-title { color: #5ef080; }
    .popup.lose .p-title { color: #ff7675; }

    .close-btn {
      padding: 10px 32px;
      background: linear-gradient(135deg, #f7c948, #ff8c00);
      color: #1a1a2e;
      font-weight: 700;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform .15s;
    }
    .close-btn:hover { transform: scale(1.05); }

    /* ── CONFETTI ── */
    .confetti-piece {
      position: fixed;
      top: -20px;
      font-size: 1.6rem;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 70;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>🍬 สุ่มขนม</h1>
  <p>หมุนวงล้อเพื่อลุ้นรับขนม!</p>
</header>

<div class="badge">💰 ราคาหมุนครั้งละ <strong>10 บาท</strong></div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheelCanvas" width="340" height="340"></canvas>
</div>

<button class="spin-btn" id="spinBtn">🎰 หมุนเลย! (10฿)</button>

<div class="stock-row">
  <span>ขนมคงเหลือ:</span>
  <div class="stock-dots" id="stockDots"></div>
  <span id="stockNum">20</span> <span>ชิ้น</span>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="val" id="spinsVal">0</div>
    <div class="lbl">จำนวนหมุน (ครั้ง)</div>
  </div>
  <div class="stat-card">
    <div class="val" id="revenueVal">0฿</div>
    <div class="lbl">รายรับรวม</div>
  </div>
  <div class="stat-card">
    <div class="val" id="costVal">0฿</div>
    <div class="lbl">ต้นทุนขนม</div>
  </div>
  <div class="stat-card">
    <div class="val" id="profitVal">0฿</div>
    <div class="lbl">กำไรสุทธิ</div>
  </div>
</div>
<div class="note">
  สูตรกำไร: ราคาหมุน 10฿ × อัตราชนะ 67% → ต้นทุนเฉลี่ย 4฿/ครั้ง → กำไร ~6฿/ครั้ง
</div>

<!-- Overlay + popup -->
<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
  <div class="p-icon" id="pIcon"></div>
  <div class="p-title" id="pTitle"></div>
  <div class="p-sub" id="pSub"></div>
  <button class="close-btn" id="closeBtn">ตกลง</button>
</div>

<script>
/* ── WHEEL DATA ──────────────────────────────────────────────────────── */
// 12 sections: 8 win (candy) + 4 lose  →  win-rate ≈ 66.7%
// Expected candy cost per spin = 0.667 × 6 = 4฿
// Charge 10฿ → expected profit = 6฿ / spin
const SECTIONS = [
  { emoji:'🍬', label:'ได้ขนม!', type:'win',  bg:'#ff6b6b', fg:'#2d0000' },
  { emoji:'🍭', label:'ได้ขนม!', type:'win',  bg:'#4ecdc4', fg:'#002d2b' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#4a4a6a', fg:'#ccc'    },
  { emoji:'🍫', label:'ได้ขนม!', type:'win',  bg:'#f7dc6f', fg:'#2d2500' },
  { emoji:'🍡', label:'ได้ขนม!', type:'win',  bg:'#c39bd3', fg:'#200030' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#4a4a6a', fg:'#ccc'    },
  { emoji:'🧁', label:'ได้ขนม!', type:'win',  bg:'#f0b27a', fg:'#2d1400' },
  { emoji:'🍩', label:'ได้ขนม!', type:'win',  bg:'#82e0aa', fg:'#002d12' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#4a4a6a', fg:'#ccc'    },
  { emoji:'🍪', label:'ได้ขนม!', type:'win',  bg:'#85c1e9', fg:'#001a2d' },
  { emoji:'🍮', label:'ได้ขนม!', type:'win',  bg:'#f1948a', fg:'#2d0000' },
  { emoji:'💨', label:'ลองใหม่', type:'lose', bg:'#4a4a6a', fg:'#ccc'    },
];

const SPIN_COST   = 10;
const CANDY_COST  = 6;
const INIT_STOCK  = 20;
const N           = SECTIONS.length;
const SEC_DEG     = 360 / N;

/* ── STATE ──────────────────────────────────────────────────────────── */
let spinning    = false;
let currentDeg  = 0;          // accumulated CSS rotation (degrees)
let stock       = INIT_STOCK;
let totalSpins  = 0;
let revenue     = 0;
let costTotal   = 0;

/* ── CANVAS SETUP ───────────────────────────────────────────────────── */
const canvas = document.getElementById('wheelCanvas');
const ctx    = canvas.getContext('2d');
const CX = canvas.width  / 2;
const CY = canvas.height / 2;
const R  = CX - 8;

function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const start = (i * SEC_DEG - 90) * Math.PI / 180;
    const end   = ((i + 1) * SEC_DEG - 90) * Math.PI / 180;
    const mid   = ((i + 0.5) * SEC_DEG - 90) * Math.PI / 180;

    // Slice
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = SECTIONS[i].bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text (emoji + label) — rotate so text reads outward
    const tx = CX + R * 0.64 * Math.cos(mid);
    const ty = CY + R * 0.64 * Math.sin(mid);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(mid + Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '22px Arial';
    ctx.fillText(SECTIONS[i].emoji, 0, -9);

    ctx.font = 'bold 10px Segoe UI, sans-serif';
    ctx.fillStyle = SECTIONS[i].fg;
    ctx.fillText(SECTIONS[i].label, 0, 9);
    ctx.restore();
  }

  // Outer gold ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = '#f7c948';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Centre hub
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 26);
  grad.addColorStop(0, '#ffe566');
  grad.addColorStop(1, '#e67e00');
  ctx.beginPath();
  ctx.arc(CX, CY, 26, 0, 2 * Math.PI);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐', CX, CY);
}

/* ── STOCK DOTS ─────────────────────────────────────────────────────── */
const stockDotsEl = document.getElementById('stockDots');
function buildDots() {
  stockDotsEl.innerHTML = '';
  for (let i = 0; i < INIT_STOCK; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i >= stock ? ' used' : '');
    d.id = `dot-${i}`;
    stockDotsEl.appendChild(d);
  }
}
function useDot() {
  const dotEl = document.getElementById(`dot-${stock}`);
  if (dotEl) dotEl.classList.add('used');
}

/* ── SPIN ───────────────────────────────────────────────────────────── */
document.getElementById('spinBtn').addEventListener('click', spin);

function spin() {
  if (spinning || stock <= 0) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick target section
  const targetIdx = Math.floor(Math.random() * N);

  // How many degrees to rotate so targetIdx lands under the pointer.
  // Pointer is at top (0°). Section i occupies [(i)*SEC_DEG, (i+1)*SEC_DEG] clockwise from top.
  // After CW rotation X, the section at pointer was originally at (360 - X%360) from top.
  // We want (targetIdx + 0.5)*SEC_DEG = 360 - (newDeg % 360)  → solve for delta
  const targetCenter = (targetIdx + 0.5) * SEC_DEG;                     // degrees from top
  const needed       = (360 - targetCenter % 360 + 360) % 360;          // CW rotation needed (mod 360)
  const currentNorm  = ((currentDeg % 360) + 360) % 360;
  const delta        = ((needed - currentNorm) + 360) % 360 || 360;     // always positive
  const newDeg       = currentDeg + 1440 + delta;                       // ≥ 4 full spins

  // Disable transition then reset, re-enable, set target (prevents glitch on first spin)
  canvas.style.transition = 'none';
  canvas.style.transform  = `rotate(${currentDeg}deg)`;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      canvas.style.transition = 'transform 4s cubic-bezier(0.22, 1, 0.36, 1)';
      canvas.style.transform  = `rotate(${newDeg}deg)`;
    });
  });

  canvas.addEventListener('transitionend', function handler() {
    canvas.removeEventListener('transitionend', handler);
    currentDeg = newDeg;
    spinning   = false;

    // Update stats
    totalSpins++;
    revenue += SPIN_COST;
    if (SECTIONS[targetIdx].type === 'win') {
      costTotal += CANDY_COST;
      useDot();
      stock--;
      document.getElementById('stockNum').textContent = stock;
    }
    updateStats();
    showPopup(SECTIONS[targetIdx]);

    if (stock <= 0) {
      const btn = document.getElementById('spinBtn');
      btn.textContent = '❌ ขนมหมดแล้ว';
      btn.disabled = true;
    } else {
      document.getElementById('spinBtn').disabled = false;
    }
  });
}

/* ── STATS ──────────────────────────────────────────────────────────── */
function updateStats() {
  document.getElementById('spinsVal').textContent   = totalSpins;
  document.getElementById('revenueVal').textContent = revenue + '฿';
  document.getElementById('costVal').textContent    = costTotal + '฿';
  document.getElementById('profitVal').textContent  = (revenue - costTotal) + '฿';
}

/* ── POPUP ──────────────────────────────────────────────────────────── */
const overlay  = document.getElementById('overlay');
const popup    = document.getElementById('popup');
const closeBtn = document.getElementById('closeBtn');

function showPopup(section) {
  popup.className = 'popup ' + section.type;
  document.getElementById('pIcon').textContent  = section.emoji;
  if (section.type === 'win') {
    document.getElementById('pTitle').textContent = '🎉 ยินดีด้วย! ได้ขนม!';
    document.getElementById('pSub').textContent   = `คุณได้รับขนม 1 ชิ้น (ต้นทุน 6฿) | เหลือขนม ${stock} ชิ้น`;
    launchConfetti();
  } else {
    document.getElementById('pTitle').textContent = '😢 เสียใจด้วย';
    document.getElementById('pSub').textContent   = 'โชคดีครั้งหน้านะ! ลองอีกสักครั้ง';
  }
  overlay.classList.add('show');
  requestAnimationFrame(() => popup.classList.add('show'));
}

function closePopup() {
  popup.classList.remove('show');
  overlay.classList.remove('show');
}

overlay.addEventListener('click', closePopup);
closeBtn.addEventListener('click', closePopup);

/* ── CONFETTI ───────────────────────────────────────────────────────── */
const EMOJIS = ['🍬','🍭','🍡','🍩','🍪','🍫','🧁','🌟','✨','🎊'];
function launchConfetti() {
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.left     = Math.random() * 100 + 'vw';
    el.style.fontSize = (1.2 + Math.random() * 1.4) + 'rem';
    const dur = 1.6 + Math.random() * 1.4;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay    = (Math.random() * 0.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + 0.5) * 1000);
  }
}

/* ── INIT ───────────────────────────────────────────────────────────── */
drawWheel();
buildDots();
</script>
</body>
</html>
